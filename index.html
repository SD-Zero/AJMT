<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Mastertrack Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #231438;
      --card-bg: #351f54;
      --accent: #ffe66d;
      --highlight: #4ecdc4;
      --text-main: #f5efff;
      --danger: #ff4757;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Toolbar tweaks per request --- */
    .topbar { position: relative; display:flex; align-items:center; gap:12px; padding:10px 18px; background: rgba(0,0,0,0.6); width:100%; box-sizing:border-box; }

    /* Spread left icons wider (updated to 28px gap) */
    .icon-row{ display:flex; align-items:center; gap:28px; margin-left:34px }

    /* Right side should be spread out as much as left */
    .topbar-right{ display:flex; align-items:center; gap:28px; margin-right:34px }

    /* Plain tool style (used for both left and right icons now) */
    .plain-tool{ background:transparent; border:none; padding:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .plain-svg{ width:18px; height:18px; display:block; filter: invert(1) brightness(2); }

    /* Color circle stays as before */
    .color-circle{ width:28px; height:28px; border-radius:50%; border:2px solid #ffffff; box-sizing:border-box; }

    /* keep the rest of layout intact (minimal changes) */
    .controls-card{ display:none }
    .tracks-container{ display:none }

    .project-name{ position:absolute; left:50%; transform:translateX(-50%); color:var(--accent); font-weight:600; }

  </style>
</head>
<body>

  <div class="topbar" role="banner" aria-label="Top Bar">
    <div class="topbar-left" style="display:flex;align-items:center">
      <div id="galleryLabel" class="gallery-label" style="color:var(--text-main);-webkit-user-select:none;user-select:none">Gallery</div>

      <div class="icon-row" aria-hidden="false">
        <!-- Wrench (now plain icon) -->
        <button id="tool-actions" class="plain-tool" aria-label="Actions" title="Actions">
          <img class="plain-svg" src="https://www.svgrepo.com/show/535743/wrench.svg" alt="wrench icon">
        </button>

        <!-- Wand -->
        <button id="tool-adjustments" class="plain-tool" aria-label="Adjustments" title="Adjustments">
          <img class="plain-svg" src="https://www.svgrepo.com/show/435698/magic-wand.svg" alt="wand icon">
        </button>

        <!-- Selection -->
        <button id="tool-selections" class="plain-tool" aria-label="Selections" title="Selections">
          <img class="plain-svg" src="https://www.svgrepo.com/show/522273/selection.svg" alt="selection icon">
        </button>

        <!-- Cursor -->
        <button id="tool-transform" class="plain-tool" aria-label="Transform" title="Transform">
          <img class="plain-svg" src="https://www.svgrepo.com/show/535338/cursor.svg" alt="cursor icon">
        </button>
      </div>
    </div>

    <div style="flex:1"></div>

    <!-- Right-side tools (ordered left-to-right visually as requested right-to-left originally) -->
    <div class="topbar-right" aria-hidden="false">
      <!-- Paint brush (selected by default) -->
      <button id="tool-paint" class="plain-tool" aria-label="Paint" title="Paint">
        <img class="plain-svg" src="https://www.svgrepo.com/show/485640/brush.svg" alt="brush icon">
      </button>

      <!-- Smudge -> point-down icon -->
      <button id="tool-smudge" class="plain-tool" aria-label="Smudge" title="Smudge">
        <img class="plain-svg" src="https://www.svgrepo.com/show/535580/point-down.svg" alt="smudge icon">
      </button>

      <!-- Erase -->
      <button id="tool-erase" class="plain-tool" aria-label="Erase" title="Erase">
        <img class="plain-svg" src="https://www.svgrepo.com/show/412952/erase.svg" alt="erase icon">
      </button>

      <!-- Layers -->
      <button id="tool-layers" class="plain-tool" aria-label="Layers" title="Layers">
        <img class="plain-svg" src="https://www.svgrepo.com/show/479246/layer.svg" alt="layer icon">
      </button>

      <!-- Color circle -->
      <div id="tool-color" class="color-circle" role="button" aria-label="Color" title="Color" style="background:var(--text-main)"></div>
    </div>

    <div class="project-name" id="projectName" contenteditable="true" role="textbox" aria-label="Project name">Animal Jam Mastertrack Studio</div>
  </div>

  <script>
    // Ensure imgs load as white (some SVGs may include fills that are black; filter above in CSS inverts)
    // Also make clicking outside project name blur it (existing behavior expected elsewhere)
    document.addEventListener('pointerdown', (e)=>{
      const pn = document.getElementById('projectName');
      if (!pn.contains(e.target) && document.activeElement === pn){
        pn.blur();
        const sel = window.getSelection && window.getSelection(); if (sel && sel.removeAllRanges) sel.removeAllRanges();
      }
    }, {capture:true});
  </script>
</body>
</html>
