<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Mastertrack Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #231438;
      --card-bg: #351f54;
      --accent: #ffe66d;
      --highlight: #4ecdc4;
      --text-main: #f5efff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls-card {
      background: var(--card-bg);
      padding: 18px 24px;
      border-radius: 14px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-sizing: border-box;
    }
    h1 { color: var(--accent); margin: 0; font-size: 1.3rem; width: 100%; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.9rem; color: #d8c7ed; font-weight: 600; }
    input[type="number"], select {
      background: #190b2c;
      color: var(--accent);
      border: 1px solid #5a388a;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .btn {
      background: var(--highlight);
      color: #0f2422;
      border: none;
      padding: 9px 18px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:disabled { background: #554466; color: #887799; cursor: not-allowed; }
    input[type="file"] { display: none; }

    /* Stacked Track Containers */
    .tracks-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 950px;
    }
    .track-card {
      background: #1c0e30;
      border: 2px solid #4a2d6d;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .track-header {
      background: #351f54;
      padding: 8px 15px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      border-bottom: 1px solid #4a2d6d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .instrument-select {
      background: #231438;
      color: var(--accent);
      border: 1px solid var(--highlight);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .grid-wrapper { display: flex; width: 100%; }
    
    /* Pitch Labels */
    .pitch-labels {
      display: flex;
      flex-direction: column;
      width: 50px;
      background: #281542;
      border-right: 2px solid #4a2d6d;
      flex-shrink: 0;
    }
    .pitch-label {
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.7rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }

    /* Scrollable Canvas Container */
    .canvas-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      background: #140824;
    }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
<body>

<div class="controls-card">
  <h1>Animal Jam Mastertrack Studio</h1>
  
  <div class="control-group">
    <button class="btn" onclick="document.getElementById('midiInput').click()">📁 Load Song File</button>
    <input type="file" id="midiInput" accept=".mid,.midi">
  </div>

  <div class="control-group">
    <label for="tempoInput">Tempo (BPM):</label>
    <input type="number" id="tempoInput" value="175" min="65" max="240">
  </div>

  <div class="control-group">
    <button id="playBtn" class="btn" disabled>▶ Preview Audio</button>
  </div>
</div>

<div class="tracks-container" id="tracksContainer"></div>

<script>
  let parsedMidi = null;
  let synth = null;
  let processedLayers = [];
  let isSyncingScroll = false;

  // AJ Pitch Colors (B down to C)
  const NOTE_CONFIG = [
    { name: 'B',  color: '#ff1493' }, // Hot Pink
    { name: 'A#', color: '#8a2be2' }, // Purple
    { name: 'A',  color: '#0033cc' }, // Dark Blue
    { name: 'G#', color: '#0074d9' }, // Mid Blue
    { name: 'G',  color: '#00f3ff' }, // Light Neon Blue
    { name: 'F#', color: '#008080' }, // Teal
    { name: 'F',  color: '#00ff00' }, // Neon Green
    { name: 'E',  color: '#32cd32' }, // Neon Lime Green
    { name: 'D#', color: '#ffd700' }, // Gold
    { name: 'D',  color: '#ff7f00' }, // Orange
    { name: 'C#', color: '#ff4500' }, // Reddish Orange
    { name: 'C',  color: '#ff0000' }  // Bright Red
  ];

  // 10 Official AJ Instruments
  const AJ_INSTRUMENTS = [
    "Grand Piano", "Simple Piano", "Bass", "Chip Synth", 
    "Drum Kit", "Chirping Bells", "Gritty Brass", 
    "Sunny Synth", "Harp", "Gentle Brass"
  ];

  const ROW_HEIGHT = 16;
  const COL_WIDTH = 28;

  function getMaxColumns() {
    let bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    bpm = Math.max(65, Math.min(240, bpm));
    return Math.floor((300 * bpm) / 15);
  }

  function autoDetectAJInstrument(trackName, midiNumber) {
    const name = (trackName || "").toLowerCase();
    if (name.includes("drum") || name.includes("percussion")) return "Drum Kit";
    if (name.includes("bass")) return "Bass";
    if (name.includes("bell") || name.includes("chime")) return "Chirping Bells";
    if (name.includes("brass") || name.includes("horn") || name.includes("trumpet")) return "Gritty Brass";
    if (name.includes("synth") || name.includes("lead")) return "Chip Synth";
    if (name.includes("harp")) return "Harp";

    if (midiNumber !== undefined) {
      if (midiNumber >= 32 && midiNumber <= 39) return "Bass";
      if (midiNumber >= 56 && midiNumber <= 63) return "Gentle Brass";
      if (midiNumber >= 46 && midiNumber <= 46) return "Harp";
      if (midiNumber >= 80 && midiNumber <= 87) return "Sunny Synth";
      if (midiNumber >= 9 && midiNumber <= 15) return "Chirping Bells";
    }
    return "Grand Piano";
  }

  document.getElementById('tempoInput').addEventListener('change', () => {
    if (parsedMidi) processAndRender();
  });

  document.getElementById('midiInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();
    parsedMidi = new Midi(arrayBuffer);

    processAndRender();
    document.getElementById('playBtn').disabled = false;
  });

  function processAndRender() {
    if (!parsedMidi) return;

    const bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    const secPerCol = 15 / bpm;
    const maxCols = getMaxColumns();

    processedLayers = [];

    function addNoteToLayers(instrumentName, note) {
      if (note.time > 300) return;

      const startCol = Math.floor(note.time / secPerCol);
      const colDuration = Math.max(1, Math.round(note.duration / secPerCol));
      if (startCol >= maxCols) return;

      const pitchName = note.pitch;
      const rowIdx = NOTE_CONFIG.findIndex(c => c.name === pitchName);
      if (rowIdx === -1) return;

      let targetLayer = processedLayers.find(layer => {
        if (layer.instrument !== instrumentName) return false;
        return !layer.notes.some(n => 
          n.rowIdx === rowIdx && 
          !(startCol + colDuration <= n.startCol || startCol >= n.startCol + n.colDuration)
        );
      });

      if (!targetLayer) {
        if (processedLayers.length >= 11) return;
        targetLayer = {
          id: processedLayers.length + 1,
          instrument: instrumentName,
          notes: []
        };
        processedLayers.push(targetLayer);
      }

      targetLayer.notes.push({
        pitch: pitchName,
        octave: note.octave,
        fullNote: note.name,
        startCol: startCol,
        colDuration: colDuration,
        rowIdx: rowIdx,
        x: startCol * COL_WIDTH,
        y: rowIdx * ROW_HEIGHT,
        w: Math.min(colDuration * COL_WIDTH, (maxCols - startCol) * COL_WIDTH),
        h: ROW_HEIGHT,
        color: NOTE_CONFIG[rowIdx].color
      });
    }

    parsedMidi.tracks.forEach((track) => {
      const detectedInst = autoDetectAJInstrument(
        track.name, 
        track.instrument ? track.instrument.number : undefined
      );
      track.notes.forEach(note => addNoteToLayers(detectedInst, note));
    });

    renderStackedGrids(maxCols);
  }

  function renderStackedGrids(maxCols) {
    const container = document.getElementById('tracksContainer');
    container.innerHTML = '';
    const scrollContainers = [];

    processedLayers.forEach((layer, layerIdx) => {
      const card = document.createElement('div');
      card.className = 'track-card';

      const header = document.createElement('div');
      header.className = 'track-header';

      const labelGroup = document.createElement('div');
      labelGroup.style.display = 'flex';
      labelGroup.style.alignItems = 'center';
      labelGroup.style.gap = '10px';

      const titleSpan = document.createElement('span');
      titleSpan.innerText = `Layer ${layerIdx + 1}:`;

      const select = document.createElement('select');
      select.className = 'instrument-select';
      AJ_INSTRUMENTS.forEach(inst => {
        const opt = document.createElement('option');
        opt.value = inst;
        opt.innerText = inst;
        if (inst === layer.instrument) opt.selected = true;
        select.appendChild(opt);
      });

      select.addEventListener('change', (e) => {
        layer.instrument = e.target.value;
      });

      labelGroup.appendChild(titleSpan);
      labelGroup.appendChild(select);

      const countSpan = document.createElement('span');
      countSpan.innerText = `${layer.notes.length} Notes`;

      header.appendChild(labelGroup);
      header.appendChild(countSpan);
      card.appendChild(header);

      const gridWrapper = document.createElement('div');
      gridWrapper.className = 'grid-wrapper';

      const pitchLabels = document.createElement('div');
      pitchLabels.className = 'pitch-labels';
      NOTE_CONFIG.forEach(cfg => {
        const lbl = document.createElement('div');
        lbl.className = 'pitch-label';
        lbl.style.backgroundColor = cfg.color;
        lbl.innerText = cfg.name;
        pitchLabels.appendChild(lbl);
      });
      gridWrapper.appendChild(pitchLabels);

      const canvasContainer = document.createElement('div');
      canvasContainer.className = 'canvas-container';
      scrollContainers.push(canvasContainer);

      const canvas = document.createElement('canvas');
      canvas.width = maxCols * COL_WIDTH;
      canvas.height = 12 * ROW_HEIGHT;
      const ctx = canvas.getContext('2d');

      // 1. Draw Background Checkered Grid
      for (let col = 0; col < maxCols; col++) {
        for (let row = 0; row < 12; row++) {
          const isDark = (col + row) % 2 === 0;
          ctx.fillStyle = isDark ? '#1a0e2e' : '#23133d';
          ctx.fillRect(col * COL_WIDTH, row * ROW_HEIGHT, COL_WIDTH, ROW_HEIGHT);
        }
      }

      // 2. Render Note Blocks
      layer.notes.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      });

      canvasContainer.appendChild(canvas);
      gridWrapper.appendChild(canvasContainer);
      card.appendChild(gridWrapper);
      container.appendChild(card);
    });

    // Synchronize horizontal scrolling across all layer canvases
    scrollContainers.forEach(targetContainer => {
      targetContainer.addEventListener('scroll', () => {
        if (!isSyncingScroll) {
          isSyncingScroll = true;
          const scrollPos = targetContainer.scrollLeft;
          scrollContainers.forEach(c => {
            if (c !== targetContainer) c.scrollLeft = scrollPos;
          });
          isSyncingScroll = false;
        }
      });
    });
  }

  // Audio Playback
  document.getElementById('playBtn').addEventListener('click', async () => {
    await Tone.start();
    if (!synth) synth = new Tone.PolySynth(Tone.Synth).toDestination();

    Tone.Transport.cancel();
    parsedMidi.tracks.forEach(track => {
      track.notes.forEach(note => {
        if (note.time <= 300) {
          Tone.Transport.schedule((time) => {
            synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
          }, note.time);
        }
      });
    });
    Tone.Transport.start();
  });
</script>
</body>
</html>
