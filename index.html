<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Mastertrack Converter & Grid</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #1a0f2b;
      --card-bg: #2d1945;
      --accent: #ffe66d;
      --highlight: #4ecdc4;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls-card {
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      color: var(--accent);
      margin: 0;
      font-size: 1.4rem;
      width: 100%;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-size: 0.9rem;
      color: #d0c2e0;
      font-weight: bold;
    }
    input[type="number"], select {
      background: #1a0f2b;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn {
      background: var(--highlight);
      color: #121e1d;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    input[type="file"] { display: none; }

    /* Inspector Bar */
    .inspector-bar {
      background: #11081f;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 15px;
      width: 100%;
      max-width: 950px;
      font-family: monospace;
      color: var(--accent);
      margin-bottom: 15px;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    /* Grid Layout Container */
    .grid-wrapper {
      display: flex;
      width: 100%;
      max-width: 950px;
      background: #11081f;
      border: 2px solid #4a2d6d;
      border-radius: 10px;
      overflow: hidden;
    }
    
    /* Y-Axis Pitch Labels */
    .pitch-labels {
      display: flex;
      flex-direction: column;
      width: 55px;
      background: #25133b;
      border-right: 2px solid #4a2d6d;
    }
    .pitch-label {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      border-bottom: 1px solid #371b58;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
    }

    /* Scrollable Canvas Area */
    .canvas-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      background: #180c29;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="controls-card">
  <h1>Animal Jam Mastertrack Note Grid</h1>
  
  <div class="control-group">
    <button class="btn" onclick="document.getElementById('midiInput').click()">📁 Load MIDI</button>
    <input type="file" id="midiInput" accept=".mid,.midi">
  </div>

  <div class="control-group">
    <label for="tempoInput">Tempo (BPM):</label>
    <input type="number" id="tempoInput" value="175" min="65" max="240">
  </div>

  <div class="control-group">
    <label for="octaveSelect">Octave:</label>
    <select id="octaveSelect">
      <option value="0">Octave 0</option>
      <option value="1">Octave 1</option>
      <option value="2">Octave 2</option>
      <option value="3">Octave 3</option>
      <option value="4" selected>Octave 4</option>
      <option value="5">Octave 5</option>
      <option value="6">Octave 6</option>
      <option value="7">Octave 7</option>
    </select>
  </div>

  <div class="control-group">
    <button id="playBtn" class="btn" disabled>▶ Preview</button>
  </div>
</div>

<div class="inspector-bar" id="inspector">
  Status: Load a MIDI file to generate the Mastertracks grid...
</div>

<div class="grid-wrapper">
  <div class="pitch-labels" id="pitchLabels"></div>
  
  <div class="canvas-container">
    <canvas id="gridCanvas"></canvas>
  </div>
</div>

<script>
  let parsedMidi = null;
  let synth = null;
  let noteBlocks = [];

  // AJ Chromatic Note Pitch Setup (Top to Bottom: B down to C)
  const NOTE_CONFIG = [
    { name: 'B',  color: '#ff1493' }, // Hot Pink
    { name: 'A#', color: '#8a2be2' }, // Purple
    { name: 'A',  color: '#0033cc' }, // Dark Blue
    { name: 'G#', color: '#0074d9' }, // Mid Blue
    { name: 'G',  color: '#00f3ff' }, // Light Neon Blue
    { name: 'F#', color: '#008080' }, // Teal
    { name: 'F',  color: '#1022d9' }, // Neon Green
    { name: 'E',  color: '#32cd32' }, // Neon Lime Green
    { name: 'D#', color: '#ffd700' }, // Gold
    { name: 'D',  color: '#ff7f00' }, // Orange
    { name: 'C#', color: '#ff4500' }, // Reddish Orange
    { name: 'C',  color: '#ff0000' }  // Bright Red
  ];

  // Adjust display name for F row
  NOTE_CONFIG[6].color = '#00ff00';

  const ROW_HEIGHT = 24;
  const COL_WIDTH = 18;

  // Render Left Side Pitch Labels
  const labelsContainer = document.getElementById('pitchLabels');
  NOTE_CONFIG.forEach(cfg => {
    const div = document.createElement('div');
    div.className = 'pitch-label';
    div.style.backgroundColor = cfg.color;
    div.innerText = cfg.name;
    labelsContainer.appendChild(div);
  });

  // Calculate Max Columns for 5 Minutes at selected Tempo
  function getMaxColumns() {
    let bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    bpm = Math.max(65, Math.min(240, bpm)); // Clamp to 65 - 240
    // 5 minutes = 300 seconds. Column duration = (15 / BPM) seconds
    return Math.floor((300 * bpm) / 15);
  }

  document.getElementById('tempoInput').addEventListener('change', () => {
    if (parsedMidi) renderGrid();
  });

  document.getElementById('octaveSelect').addEventListener('change', () => {
    if (parsedMidi) renderGrid();
  });

  document.getElementById('midiInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();
    parsedMidi = new Midi(arrayBuffer);

    // Limit layers to AJ's 11 maximum
    if (parsedMidi.tracks.length > 11) {
      parsedMidi.tracks = parsedMidi.tracks.slice(0, 11);
    }

    renderGrid();
    document.getElementById('playBtn').disabled = false;
  });

  function renderGrid() {
    if (!parsedMidi) return;

    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    
    const bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    const currentOctave = parseInt(document.getElementById('octaveSelect').value);
    const maxCols = getMaxColumns();

    canvas.width = maxCols * COL_WIDTH;
    canvas.height = 12 * ROW_HEIGHT;

    // 1. Draw Checkered Background
    for (let col = 0; col < maxCols; col++) {
      for (let row = 0; row < 12; row++) {
        const isDark = (col + row) % 2 === 0;
        ctx.fillStyle = isDark ? '#1a0e2e' : '#23133d';
        ctx.fillRect(col * COL_WIDTH, row * ROW_HEIGHT, COL_WIDTH, ROW_HEIGHT);

        // Grid lines
        ctx.strokeStyle = '#2d184d';
        ctx.strokeRect(col * COL_WIDTH, row * ROW_HEIGHT, COL_WIDTH, ROW_HEIGHT);
      }
    }

    // 2. Process and Filter Note Blocks
    noteBlocks = [];
    const secPerColumn = 15 / bpm;

    parsedMidi.tracks.forEach((track, layerIdx) => {
      const instrumentName = track.instrument ? track.instrument.name : `Layer ${layerIdx + 1}`;

      track.notes.forEach(note => {
        // Strict 5-minute cap
        if (note.time > 300) return;

        const startCol = Math.floor(note.time / secPerColumn);
        const colDuration = Math.max(1, Math.round(note.duration / secPerColumn));

        // Enforce max columns limit
        if (startCol >= maxCols) return;

        // Check if note is in currently selected octave
        if (note.octave === currentOctave) {
          // Convert Pitch Name (e.g., "C#") to row index 0..11
          const noteBaseName = note.pitch; // E.g., 'C', 'C#', etc.
          const rowIdx = NOTE_CONFIG.findIndex(cfg => cfg.name === noteBaseName);

          if (rowIdx !== -1) {
            const block = {
              layer: layerIdx + 1,
              instrument: instrumentName,
              noteName: note.name,
              pitch: noteBaseName,
              octave: note.octave,
              colStart: startCol,
              colDuration: colDuration,
              timeSec: note.time,
              durationSec: note.duration,
              x: startCol * COL_WIDTH,
              y: rowIdx * ROW_HEIGHT,
              w: Math.min(colDuration * COL_WIDTH, (maxCols - startCol) * COL_WIDTH),
              h: ROW_HEIGHT,
              color: NOTE_CONFIG[rowIdx].color
            };
            noteBlocks.push(block);
          }
        }
      });
    });

    // 3. Render Note Blocks onto Grid
    noteBlocks.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

      // Block outline
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    });

    document.getElementById('inspector').innerText = 
      `Loaded! Tempo: ${bpm} BPM | Max Columns: ${maxCols} | Showing Octave: ${currentOctave}`;
  }

  // Handle Canvas Tap/Click for Note Details
  document.getElementById('gridCanvas').addEventListener('click', (e) => {
    const canvas = document.getElementById('gridCanvas');
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    const hit = noteBlocks.find(b => {
      return clickX >= b.x && clickX <= (b.x + b.w) &&
             clickY >= b.y && clickY <= (b.y + b.h);
    });

    if (hit) {
      document.getElementById('inspector').innerText = 
        `[Note Info] Pitch: ${hit.noteName} | Octave: ${hit.octave} | Layer: ${hit.layer} (${hit.instrument}) | Column Start: ${hit.colStart + 1} | Length: ${hit.colDuration} grid block(s)`;
    }
  });

  // Audio Preview
  document.getElementById('playBtn').addEventListener('click', async () => {
    await Tone.start();
    if (!synth) synth = new Tone.PolySynth(Tone.Synth).toDestination();

    Tone.Transport.cancel();
    parsedMidi.tracks.forEach(track => {
      track.notes.forEach(note => {
        if (note.time <= 300) {
          Tone.Transport.schedule((time) => {
            synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
          }, note.time);
        }
      });
    });
    Tone.Transport.start();
  });
</script>

</body>
</html>
