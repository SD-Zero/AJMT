<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Procreate - Mockup</title>
    <style>
      :root{
        --bg:#242424; /* requested background */
        --grid:#2D2D2D; /* grid lines */
        --topbar: rgba(30,30,30,0.55); /* slightly darker, transparent */
        --topbar-border: rgba(0,0,0,0.35);
        --circle:#2b2b2b; /* dark gray circle */
        --icon:#cfcfcf; /* light gray icon */
        --gap:12px;
      }

      /* Full window background with a small square grid using CSS gradients */
      html,body{height:100%;margin:0}
      body{
        background-color:var(--bg);
        /* small 16px grid */
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size:16px 16px;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        color: #fff;
      }

      .topbar{
        height:64px;
        display:flex;
        align-items:center;
        gap:var(--gap);
        padding:0 20px;
        /* slightly darker + translucent with blur */
        background:var(--topbar);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border-bottom:1px solid var(--topbar-border);
        position:fixed;
        left:24px;right:24px;top:24px;
        border-radius:12px;
        box-shadow:0 6px 18px rgba(0,0,0,0.45);
      }

      .topbar-left{display:flex;align-items:center;gap:16px}

      .gallery-label{
        color:#ffffff;
        font-weight:700;
        font-size:16px;
        letter-spacing:0.02em;
      }

      .icon-row{display:flex;align-items:center;gap:10px;margin-left:8px}

      .icon-circle{
        width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
        background:var(--circle);border:1px solid rgba(255,255,255,0.03);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 3px 10px rgba(0,0,0,0.35);
        cursor:default;
      }

      .icon-svg{width:20px;height:20px;fill:var(--icon)}

      /* spacer to keep topbar content left-aligned */
      .topbar-spacer{flex:1}

      /* Helpers for vertical centering and small accessibility text-size */
      .sr-label{font-size:13px}

      main{padding-top:120px}
    </style>
  </head>
  <body>

    <div class="topbar" role="banner">
      <div class="topbar-left">
        <div class="gallery-label">Gallery</div>

        <div class="icon-row" aria-hidden="false">
          <!-- Wrench / settings icon -->
          <div class="icon-circle" title="Wrench">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22.7 19.3l-4.6-4.6a6.5 6.5 0 0 0 .3-1.8 6.5 6.5 0 0 0-6.5-6.5c-.6 0-1.2.1-1.8.3L4.7 2.3 2.3 4.7l6.9 6.9c-.2.6-.3 1.2-.3 1.8 0 3.6 2.9 6.5 6.5 6.5.6 0 1.2-.1 1.8-.3l6.9 6.9 2.4-2.4-6.1-6.1z" transform="translate(-1 -1)" />
            </svg>
          </div>

          <!-- Magic wand icon -->
          <div class="icon-circle" title="Magic Wand">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 21l7-7M7 7l3-3 3 3-3 3-3-3zm7.5 1.5L21 2l1.5 1.5-5.5 5.5-1.5-1.5zM16 9l5 5" stroke="none"/>
              <!-- Simpler filled wand look -->
              <path d="M3.3 18.7c-.4.4-.4 1 0 1.4.4.4 1 .4 1.4 0L12 12.8l-2.8-2.8L3.3 18.7zM20.6 5.6l-1.4-1.4-1.1 1.1 1.4 1.4 1.1-1.1z"/>
            </svg>
          </div>

          <!-- S-shaped ribbon icon -->
          <div class="icon-circle" title="Ribbon">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 4c3 0 4 3 7 3s4-3 7-3v5c-3 0-4-3-7-3s-4 3-7 3V4zM6 20c3 0 4-3 7-3s4 3 7 3v-5c-3 0-4 3-7 3s-4-3-7-3v5z"/>
            </svg>
          </div>

          <!-- Mouse cursor icon -->
          <div class="icon-circle" title="Cursor">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 9-9 3-3 9-6-21z"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <!-- right side empty for now, keeps left layout stable -->
      <div aria-hidden="true" style="opacity:0.6;font-size:13px">&nbsp;</div>
    </div>

    <main>
      <!-- Empty canvas area placeholder; user asked to first create background + topbar -->
    </main>

  </body>
</html>
