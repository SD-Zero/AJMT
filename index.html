<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Procreate - Mockup</title>
    <style>
      :root{
        --bg:#242424; /* requested background */
        --grid:#2D2D2D; /* grid lines */
        --topbar: rgba(30,30,30,0.85); /* slightly darker, semi-transparent */
        --circle:#1d1d1d; /* darker gray circle */
        --icon:#cfcfcf; /* light gray icon */
        --gap:12px;
      }

      /* Full window background with a small square grid using CSS gradients */
      html,body{height:100%;margin:0}
      body{
        background-color:var(--bg);
        /* small 16px grid */
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size:16px 16px;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        color: #fff;
      }

      /* Topbar: flush to top/left/right, sleeker height, no floating shadow or radius */
      .topbar{
        height:48px;
        display:flex;
        align-items:center;
        gap:var(--gap);
        padding:0 18px;
        background:var(--topbar);
        /* slight translucency kept, but NO shadows and no blur */
        position:fixed;
        left:0;right:0;top:0;
        border-bottom:1px solid rgba(0,0,0,0.35);
      }

      .topbar-left{display:flex;align-items:center;gap:14px}

      /* Gallery text: lighter weight and smaller */
      .gallery-label{
        color:#ffffff;
        font-weight:500;
        font-size:14px;
        letter-spacing:0.01em;
      }

      .icon-row{display:flex;align-items:center;gap:10px;margin-left:6px}

      /* Dark circular buttons, no shadow, darker fill */
      .icon-circle{
        width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
        background:var(--circle);
        border:1px solid rgba(255,255,255,0.03);
        cursor:pointer;
      }

      .icon-svg{width:18px;height:18px;fill:var(--icon)}

      .topbar-spacer{flex:1}

      main{padding-top:48px}

    </style>
  </head>
  <body>

    <div class="topbar" role="banner">
      <div class="topbar-left">
        <div class="gallery-label">Gallery</div>

        <div class="icon-row" aria-hidden="false">
          <!-- Wrench / settings icon (simple, darker button) -->
          <div class="icon-circle" title="Wrench">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21.7 13.3a1 1 0 0 0-1.2-.6l-2 .6a7 7 0 0 0-3.2-3.2l.6-2a1 1 0 0 0-.6-1.2l-2-1a1 1 0 0 0-1 .2L6 6.6A5 5 0 1 0 17.4 18l3.7-3.7a1 1 0 0 0 .6-1z"/>
            </svg>
          </div>

          <!-- Magic wand icon -->
          <div class="icon-circle" title="Magic Wand">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 17.5L10.5 10 14 13.5 6.5 21 3 17.5zM19 7l1.5-1.5L22 6l-1.5 1.5L19 7zm-4-1l.7-2 .7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>
            </svg>
          </div>

          <!-- S-shaped ribbon icon (stylized S) -->
          <div class="icon-circle" title="Ribbon">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6c2.5 0 3.5 2 6 2s3.5-2 6-2v3c-2.5 0-3.5 2-6 2s-3.5-2-6-2V6zM6 15c2.5 0 3.5-2 6-2s3.5 2 6 2v-3c-2.5 0-3.5-2-6-2s-3.5 2-6 2v3z"/>
            </svg>
          </div>

          <!-- Mouse cursor icon -->
          <div class="icon-circle" title="Cursor">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l6 12 3-2 6 8-15-18z"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <!-- right side kept empty intentionally -->
      <div aria-hidden="true" style="opacity:0.6;font-size:13px">&nbsp;</div>
    </div>

    <main>
      <!-- Empty canvas area placeholder; background & topbar updated per request -->
    </main>

  </body>
</html>
