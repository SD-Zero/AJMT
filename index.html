<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Mastertrack Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #231438;
      --card-bg: #351f54;
      --accent: #ffe66d;
      --highlight: #4ecdc4;
      --text-main: #f5efff;
      --danger: #ff4757;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls-card {
      background: var(--card-bg);
      padding: 18px 24px;
      border-radius: 14px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-sizing: border-box;
    }
    h1 { color: var(--accent); margin: 0; font-size: 1.3rem; width: 100%; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.9rem; color: #d8c7ed; font-weight: 600; }
    input[type="number"], select {
      background: #190b2c;
      color: var(--accent);
      border: 1px solid #5a388a;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .btn {
      background: var(--highlight);
      color: #0f2422;
      border: none;
      padding: 9px 18px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn:disabled { background: #554466; color: #887799; cursor: not-allowed; }
    input[type="file"] { display: none; }

    .tracks-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 950px;
    }
    .track-card {
      background: #1c0e30;
      border: 2px solid #4a2d6d;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .track-header {
      background: #351f54;
      padding: 8px 15px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent);
      border-bottom: 1px solid #4a2d6d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .instrument-select {
      background: #231438;
      color: var(--accent);
      border: 1px solid var(--highlight);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .grid-wrapper { display: flex; width: 100%; }
    
    .pitch-labels {
      display: flex;
      flex-direction: column;
      width: 50px;
      background: #281542;
      border-right: 2px solid #4a2d6d;
      flex-shrink: 0;
    }
    .pitch-label {
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.7rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }

    .canvas-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      background: #140824;
      position: relative;
    }
    canvas { display: block; cursor: pointer; }

    /* Note Inspector Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 5, 20, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: var(--card-bg);
      border: 2px solid var(--highlight);
      border-radius: 12px;
      padding: 20px 24px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .modal-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      margin: 0;
    }
    .modal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="controls-card">
  <h1>Animal Jam Mastertrack Studio</h1>
  
  <div class="control-group">
    <button class="btn" onclick="document.getElementById('songInput').click()">📁 Load MIDI / MP3</button>
    <input type="file" id="songInput" accept=".mid,.midi,.mp3,.wav">
  </div>

  <div class="control-group">
    <label for="tempoInput">Tempo (BPM):</label>
    <input type="number" id="tempoInput" value="175" min="65" max="240">
  </div>

  <div class="control-group">
    <label for="defaultOctave">Default Octave:</label>
    <input type="number" id="defaultOctave" value="4" min="0" max="7">
  </div>

  <div class="control-group">
    <button id="addLayerBtn" class="btn" style="background:#ffe66d; color:#231438;">+ Add Layer</button>
    <button id="playBtn" class="btn">▶ Preview Audio</button>
  </div>
</div>

<div class="tracks-container" id="tracksContainer"></div>

<div class="modal-overlay" id="inspectorModal">
  <div class="modal-card">
    <h3 class="modal-title" id="modalTitle">Edit Note</h3>
    
    <div class="modal-row">
      <label for="editOctave">Octave (0-7):</label>
      <input type="number" id="editOctave" min="0" max="7" value="4">
    </div>

    <div class="modal-row">
      <label for="editDuration">Length (Blocks):</label>
      <input type="number" id="editDuration" min="1" max="64" value="1">
    </div>

    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteNoteBtn">🗑 Delete</button>
      <button class="btn" id="saveNoteBtn">Save</button>
    </div>
  </div>
</div>

<script>
  let parsedMidi = null;
  let processedLayers = [];
  let layerDrawFunctions = [];
  let isSyncingScroll = false;
  let layerSamplers = {};
  let layerFallbackSynths = {};
  let activeEditingNote = null;
  let activeEditingLayerIdx = null;
  let playheadX = -1;

  const NOTE_CONFIG = [
    { name: 'B',  color: '#ff1493', semitone: 11 },
    { name: 'A#', color: '#8a2be2', semitone: 10 },
    { name: 'A',  color: '#0033cc', semitone: 9 },
    { name: 'G#', color: '#0074d9', semitone: 8 },
    { name: 'G',  color: '#00f3ff', semitone: 7 },
    { name: 'F#', color: '#008080', semitone: 6 },
    { name: 'F',  color: '#00ff00', semitone: 5 },
    { name: 'E',  color: '#32cd32', semitone: 4 },
    { name: 'D#', color: '#ffd700', semitone: 3 },
    { name: 'D',  color: '#ff7f00', semitone: 2 },
    { name: 'C#', color: '#ff4500', semitone: 1 },
    { name: 'C',  color: '#ff0000', semitone: 0 }
  ];

  const AJ_INSTRUMENTS = [
    "Grand Piano", "Simple Piano", "Bass", "Chip Synth", 
    "Chirping Bells", "Gritty Brass", "Sunny Synth", "Harp", "Gentle Brass"
  ];

  const SAMPLE_PREFIXES = {
    "Grand Piano": "grandpiano",
    "Simple Piano": "simplepiano",
    "Bass": "bass",
    "Chip Synth": "chipsynth",
    "Chirping Bells": "chirpingbells",
    "Gritty Brass": "grittybrass",
    "Sunny Synth": "sunnysynth",
    "Harp": "harp",
    "Gentle Brass": "gentlebrass"
  };

  const INSTRUMENT_VOLUMES = {
    "Grand Piano": 0,
    "Simple Piano": -1,
    "Bass": -3,
    "Chip Synth": -7,
    "Chirping Bells": +2,
    "Gritty Brass": -6,
    "Sunny Synth": -5,
    "Harp": +4,
    "Gentle Brass": -2
  };

  const ROW_HEIGHT = 16;
  const COL_WIDTH = 28;

  function getMaxColumns() {
    let bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    bpm = Math.max(65, Math.min(240, bpm));
    return Math.floor((300 * bpm) / 15);
  }

  function getVelocityForOctave(octave) {
    const oct = Math.max(0, Math.min(7, octave));
    const octaveVelocityMap = {
      0: 0.25,
      1: 0.35,
      2: 0.50,
      3: 0.70,
      4: 0.85,
      5: 0.95,
      6: 1.00,
      7: 1.00
    };
    return octaveVelocityMap[oct] || 0.8;
  }

  function getFallbackSynthForLayer(layerIdx, instrumentName) {
    if (!layerFallbackSynths[layerIdx]) {
      const volDb = INSTRUMENT_VOLUMES[instrumentName] || 0;
      layerFallbackSynths[layerIdx] = new Tone.PolySynth(Tone.Synth, {
        volume: volDb,
        envelope: {
          attack: 0.01,
          decay: 0.3,
          sustain: 0.8,
          release: 1.2
        }
      }).toDestination();
    } else {
      layerFallbackSynths[layerIdx].volume.value = INSTRUMENT_VOLUMES[instrumentName] || 0;
    }
    return layerFallbackSynths[layerIdx];
  }

  function getSamplerForLayer(layerIdx, instrumentName) {
    const prefix = SAMPLE_PREFIXES[instrumentName] || "grandpiano";
    const key = `${layerIdx}_${prefix}`;

    if (!layerSamplers[key]) {
      const volDb = INSTRUMENT_VOLUMES[instrumentName] || 0;
      layerSamplers[key] = new Tone.Sampler({
        urls: {
          C2: `${prefix}_c2.mp3`,
          C4: `${prefix}_c4.mp3`,
          C6: `${prefix}_c6.mp3`
        },
        baseUrl: "./",
        volume: volDb,
        release: 1.2
      }).toDestination();
    }
    return layerSamplers[key];
  }

  async function playNoteSample(layerIdx, instrumentName, fullNote, octave) {
    await Tone.start();
    const velocity = getVelocityForOctave(octave);
    const sampler = getSamplerForLayer(layerIdx, instrumentName);

    if (sampler && sampler.loaded) {
      sampler.triggerAttackRelease(fullNote, "4n", undefined, velocity);
    } else {
      getFallbackSynthForLayer(layerIdx, instrumentName).triggerAttackRelease(fullNote, "4n", undefined, velocity);
    }
  }

  function redrawAll() {
    layerDrawFunctions.forEach(fn => fn());
  }

  document.getElementById('tempoInput').addEventListener('change', () => {
    if (parsedMidi) processAndRender();
    else renderStackedGrids();
  });

  document.getElementById('addLayerBtn').addEventListener('click', () => {
    if (processedLayers.length >= 11) {
      alert("Maximum 11 layers allowed!");
      return;
    }
    processedLayers.push({
      id: processedLayers.length + 1,
      instrument: "Grand Piano",
      notes: []
    });
    renderStackedGrids();
  });

  // Handle both MIDI and MP3 Audio Uploads
  document.getElementById('songInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const fileName = file.name.toLowerCase();

    if (fileName.endsWith('.mid') || fileName.endsWith('.midi')) {
      const arrayBuffer = await file.arrayBuffer();
      parsedMidi = new Midi(arrayBuffer);
      processAndRender();
    } else if (fileName.endsWith('.mp3') || fileName.endsWith('.wav')) {
      processMp3Audio(file);
    }
  });

  // Convert MP3 Audio Waveforms to Mastertrack Grid Notes
  async function processMp3Audio(file) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

    const bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    const secPerCol = 15 / bpm;
    const maxCols = getMaxColumns();

    const channelData = audioBuffer.getChannelData(0);
    const sampleRate = audioBuffer.sampleRate;
    
    processedLayers = [{ id: 1, instrument: "Grand Piano", notes: [] }];

    const bufferSize = 2048;
    for (let col = 0; col < maxCols; col++) {
      const startTime = col * secPerCol;
      const startSample = Math.floor(startTime * sampleRate);

      if (startSample >= channelData.length) break;

      const chunk = channelData.subarray(startSample, startSample + bufferSize);
      const pitchHz = autoCorrelate(chunk, sampleRate);

      if (pitchHz > 0) {
        const midiNum = Math.round(69 + 12 * Math.log2(pitchHz / 440));
        const pitchIdx = midiNum % 12;
        const octave = Math.floor(midiNum / 12) - 1;

        if (octave >= 0 && octave <= 7) {
          const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
          const pitchName = noteNames[pitchIdx];
          const rowIdx = NOTE_CONFIG.findIndex(c => c.name === pitchName);

          if (rowIdx !== -1) {
            processedLayers[0].notes.push({
              pitch: pitchName,
              octave: octave,
              fullNote: `${pitchName}${octave}`,
              startCol: col,
              colDuration: 1,
              rowIdx: rowIdx,
              x: col * COL_WIDTH,
              y: rowIdx * ROW_HEIGHT,
              w: COL_WIDTH,
              h: ROW_HEIGHT,
              color: NOTE_CONFIG[rowIdx].color
            });
          }
        }
      }
    }

    renderStackedGrids();
  }

  // Pitch Detection Algorithm for Audio Waveforms
  function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length;
    let rms = 0;

    for (let i = 0; i < SIZE; i++) {
      let val = buf[i];
      rms += val * val;
    }
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1; // Silent chunk

    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) {
      if (Math.abs(buf[i]) < thres) { r1 = i; break; }
    }
    for (let i = 1; i < SIZE / 2; i++) {
      if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
    }

    buf = buf.slice(r1, r2);
    SIZE = buf.length;

    let c = new Array(SIZE).fill(0);
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE - i; j++) {
        c[i] = c[i] + buf[j] * buf[j + i];
      }
    }

    let d = 0;
    while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) {
      if (c[i] > maxval) {
        maxval = c[i];
        maxpos = i;
      }
    }
    let T0 = maxpos;
    return sampleRate / T0;
  }

  function processAndRender() {
    if (!parsedMidi) return;

    const bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    const secPerCol = 15 / bpm;
    const maxCols = getMaxColumns();

    processedLayers = [];

    function addNoteToLayers(instrumentName, note) {
      if (note.time > 300) return;

      const startCol = Math.floor(note.time / secPerCol);
      const colDuration = Math.max(1, Math.round(note.duration / secPerCol));
      if (startCol >= maxCols) return;

      const pitchName = note.pitch;
      const rowIdx = NOTE_CONFIG.findIndex(c => c.name === pitchName);
      if (rowIdx === -1) return;

      let targetLayer = processedLayers.find(layer => {
        return !layer.notes.some(n => 
          n.rowIdx === rowIdx && 
          !(startCol + colDuration <= n.startCol || startCol >= n.startCol + n.colDuration)
        );
      });

      if (!targetLayer) {
        if (processedLayers.length >= 11) return;
        targetLayer = {
          id: processedLayers.length + 1,
          instrument: "Grand Piano", // Defaults ALL layers to Grand Piano
          notes: []
        };
        processedLayers.push(targetLayer);
      }

      targetLayer.notes.push({
        pitch: pitchName,
        octave: note.octave,
        fullNote: note.name,
        startCol: startCol,
        colDuration: colDuration,
        rowIdx: rowIdx,
        x: startCol * COL_WIDTH,
        y: rowIdx * ROW_HEIGHT,
        w: Math.min(colDuration * COL_WIDTH, (maxCols - startCol) * COL_WIDTH),
        h: ROW_HEIGHT,
        color: NOTE_CONFIG[rowIdx].color
      });
    }

    parsedMidi.tracks.forEach((track) => {
      // Keeps all imported tracks as Grand Piano by default
      track.notes.forEach(note => addNoteToLayers("Grand Piano", note));
    });

    renderStackedGrids();
  }

  function renderStackedGrids() {
    const maxCols = getMaxColumns();
    const container = document.getElementById('tracksContainer');
    container.innerHTML = '';
    const scrollContainers = [];
    layerDrawFunctions = [];

    if (processedLayers.length === 0) {
      processedLayers.push({ id: 1, instrument: "Grand Piano", notes: [] });
    }

    processedLayers.forEach((layer, layerIdx) => {
      const card = document.createElement('div');
      card.className = 'track-card';

      const header = document.createElement('div');
      header.className = 'track-header';

      const labelGroup = document.createElement('div');
      labelGroup.style.display = 'flex';
      labelGroup.style.alignItems = 'center';
      labelGroup.style.gap = '10px';

      const titleSpan = document.createElement('span');
      titleSpan.innerText = `Layer ${layerIdx + 1}:`;

      const select = document.createElement('select');
      select.className = 'instrument-select';
      AJ_INSTRUMENTS.forEach(inst => {
        const opt = document.createElement('option');
        opt.value = inst;
        opt.innerText = inst;
        if (inst === layer.instrument) opt.selected = true;
        select.appendChild(opt);
      });

      select.addEventListener('change', (e) => {
        layer.instrument = e.target.value;
        getSamplerForLayer(layerIdx, layer.instrument);
      });

      labelGroup.appendChild(titleSpan);
      labelGroup.appendChild(select);

      const countSpan = document.createElement('span');
      countSpan.innerText = `${layer.notes.length} Notes`;

      header.appendChild(labelGroup);
      header.appendChild(countSpan);
      card.appendChild(header);

      const gridWrapper = document.createElement('div');
      gridWrapper.className = 'grid-wrapper';

      const pitchLabels = document.createElement('div');
      pitchLabels.className = 'pitch-labels';
      NOTE_CONFIG.forEach(cfg => {
        const lbl = document.createElement('div');
        lbl.className = 'pitch-label';
        lbl.style.backgroundColor = cfg.color;
        lbl.innerText = cfg.name;
        pitchLabels.appendChild(lbl);
      });
      gridWrapper.appendChild(pitchLabels);

      const canvasContainer = document.createElement('div');
      canvasContainer.className = 'canvas-container';
      scrollContainers.push(canvasContainer);

      const canvas = document.createElement('canvas');
      canvas.width = maxCols * COL_WIDTH;
      canvas.height = 12 * ROW_HEIGHT;
      const ctx = canvas.getContext('2d');

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let col = 0; col < maxCols; col++) {
          for (let row = 0; row < 12; row++) {
            const isDark = (col + row) % 2 === 0;
            ctx.fillStyle = isDark ? '#1a0e2e' : '#23133d';
            ctx.fillRect(col * COL_WIDTH, row * ROW_HEIGHT, COL_WIDTH, ROW_HEIGHT);
          }
        }

        layer.notes.forEach(b => {
          b.x = b.startCol * COL_WIDTH;
          b.w = b.colDuration * COL_WIDTH;

          ctx.fillStyle = b.color;
          ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px sans-serif';
          ctx.fillText(b.octave, b.x + 4, b.y + 12);
        });

        if (playheadX >= 0) {
          ctx.fillStyle = '#ffe66d';
          ctx.fillRect(playheadX, 0, 3, canvas.height);
        }

        countSpan.innerText = `${layer.notes.length} Notes`;
      }

      layerDrawFunctions.push(draw);
      draw();

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        const col = Math.floor(clickX / COL_WIDTH);
        const rowIdx = Math.floor(clickY / ROW_HEIGHT);

        const existingNote = layer.notes.find(n => 
          n.rowIdx === rowIdx && col >= n.startCol && col < (n.startCol + n.colDuration)
        );

        if (existingNote) {
          activeEditingNote = existingNote;
          activeEditingLayerIdx = layerIdx;
          document.getElementById('modalTitle').innerText = `Edit Note: ${existingNote.pitch}`;
          document.getElementById('editOctave').value = existingNote.octave;
          document.getElementById('editDuration').value = existingNote.colDuration;
          document.getElementById('inspectorModal').style.display = 'flex';
        } else {
          const placementOctave = parseInt(document.getElementById('defaultOctave').value) || 4;
          const pitchName = NOTE_CONFIG[rowIdx].name;
          const fullNote = `${pitchName}${placementOctave}`;

          const newNote = {
            pitch: pitchName,
            octave: placementOctave,
            fullNote: fullNote,
            startCol: col,
            colDuration: 1,
            rowIdx: rowIdx,
            x: col * COL_WIDTH,
            y: rowIdx * ROW_HEIGHT,
            w: COL_WIDTH,
            h: ROW_HEIGHT,
            color: NOTE_CONFIG[rowIdx].color
          };

          layer.notes.push(newNote);
          draw();
          playNoteSample(layerIdx, layer.instrument, fullNote, placementOctave);
        }
      });

      canvasContainer.appendChild(canvas);
      gridWrapper.appendChild(canvasContainer);
      card.appendChild(gridWrapper);
      container.appendChild(card);
    });

    scrollContainers.forEach(targetContainer => {
      targetContainer.addEventListener('scroll', () => {
        if (!isSyncingScroll) {
          isSyncingScroll = true;
          const scrollPos = targetContainer.scrollLeft;
          scrollContainers.forEach(c => {
            if (c !== targetContainer) c.scrollLeft = scrollPos;
          });
          isSyncingScroll = false;
        }
      });
    });
  }

  // Modal Controls
  document.getElementById('saveNoteBtn').addEventListener('click', () => {
    if (activeEditingNote && activeEditingLayerIdx !== null) {
      const newOct = parseInt(document.getElementById('editOctave').value) || 4;
      const newDur = Math.max(1, parseInt(document.getElementById('editDuration').value) || 1);

      activeEditingNote.octave = Math.max(0, Math.min(7, newOct));
      activeEditingNote.colDuration = newDur;
      activeEditingNote.fullNote = `${activeEditingNote.pitch}${activeEditingNote.octave}`;

      const layer = processedLayers[activeEditingLayerIdx];
      if (layer) playNoteSample(activeEditingLayerIdx, layer.instrument, activeEditingNote.fullNote, activeEditingNote.octave);
      redrawAll();
    }
    document.getElementById('inspectorModal').style.display = 'none';
  });

  document.getElementById('deleteNoteBtn').addEventListener('click', () => {
    if (activeEditingNote && activeEditingLayerIdx !== null) {
      const layer = processedLayers[activeEditingLayerIdx];
      if (layer) {
        const idx = layer.notes.indexOf(activeEditingNote);
        if (idx !== -1) {
          layer.notes.splice(idx, 1);
          redrawAll();
        }
      }
    }
    document.getElementById('inspectorModal').style.display = 'none';
  });

  // Playhead Animation
  function updatePlayhead() {
    if (Tone.Transport.state === "started") {
      const bpm = parseInt(document.getElementById('tempoInput').value) || 175;
      const secPerCol = 15 / bpm;
      const currentSec = Tone.Transport.seconds;
      const colPos = currentSec / secPerCol;

      playheadX = colPos * COL_WIDTH;
      redrawAll();

      const containers = document.querySelectorAll('.canvas-container');
      containers.forEach(c => {
        if (playheadX > c.scrollLeft + c.clientWidth - 100) {
          c.scrollLeft = playheadX - 100;
        }
      });

      requestAnimationFrame(updatePlayhead);
    } else {
      playheadX = -1;
      redrawAll();
    }
  }

  // Audio Preview Handler
  document.getElementById('playBtn').addEventListener('click', async () => {
    const playBtn = document.getElementById('playBtn');

    if (Tone.Transport.state === "started") {
      Tone.Transport.stop();
      playBtn.innerText = "▶ Preview Audio";
      playheadX = -1;
      redrawAll();
      return;
    }

    await Tone.start();

    processedLayers.forEach((l, idx) => getSamplerForLayer(idx, l.instrument));

    Tone.Transport.stop();
    Tone.Transport.cancel();
    Tone.Transport.position = 0;

    const bpm = parseInt(document.getElementById('tempoInput').value) || 175;
    Tone.Transport.bpm.value = bpm;
    const secPerCol = 15 / bpm;

    processedLayers.forEach((layer, layerIdx) => {
      const sampler = getSamplerForLayer(layerIdx, layer.instrument);

      layer.notes.forEach(note => {
        const time = note.startCol * secPerCol;
        const dur = note.colDuration * secPerCol;
        const velocity = getVelocityForOctave(note.octave);

        Tone.Transport.schedule((t) => {
          if (sampler && sampler.loaded) {
            sampler.triggerAttackRelease(note.fullNote, dur, t, velocity);
          } else {
            getFallbackSynthForLayer(layerIdx, layer.instrument).triggerAttackRelease(note.fullNote, dur, t, velocity);
          }
        }, time);
      });
    });

    Tone.Transport.start();
    playBtn.innerText = "⏹ Stop Preview";

    updatePlayhead();
  });

  renderStackedGrids();
</script>

</body>
</html>
