<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Procreate - Mockup</title>
    <style>
      :root{
        --bg:#242424; /* requested background */
        --grid:#2D2D2D; /* grid lines */
        --topbar: rgba(24,24,24,0.78); /* topbar color (darker than background, lighter than buttons) */
        --circle:#0d0d0d; /* very dark buttons */
        --icon:#bfbfbf; /* muted light gray icon */
        --gap:12px;
        --topbar-height:44px; /* slim bar */
        --frame-radius:40px; /* default radius, will be recalculated by JS */
      }

      /* Full window background with a small square grid using CSS gradients */
      html,body{height:100%;margin:0;overflow:hidden}
      body{
        background-color:var(--bg);
        /* small 16px grid */
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size:16px 16px;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        color: #fff;
      }

      /* Device frame: thin border around the whole viewport with rounded corners to match iPad curvature */
      .device-frame{
        position:fixed;
        left:0;right:0;top:0;bottom:0;
        border:2px solid var(--grid);
        border-radius:var(--frame-radius);
        pointer-events:none; /* don't block clicks */
        box-sizing:border-box;
      }

      /* Topbar: flush to the very top, full width, no floating inset; slim and simple */
      .topbar{
        height:var(--topbar-height);
        display:flex;
        align-items:center;
        gap:var(--gap);
        padding:0 18px;
        background:var(--topbar);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        position:fixed;
        left:0;right:0;top:0;
        box-sizing:border-box;
        border-bottom:1px solid var(--grid); /* bottom line same color as grid */
        border-top-left-radius:var(--frame-radius);
        border-top-right-radius:var(--frame-radius);
        overflow:hidden;
      }

      /* Remove any floating appearance — topbar sits flush against the frame edges */
      .topbar::before{content:'';display:block;height:0}

      .topbar-left{display:flex;align-items:center;gap:12px}

      /* Gallery text: lighter weight and smaller */
      .gallery-label{
        color:#ffffff;
        font-weight:400;
        font-size:13px;
        letter-spacing:0.01em;
      }

      /* push the buttons farther away from Gallery by increasing left margin */
      .icon-row{display:flex;align-items:center;gap:18px;margin-left:26px}

      /* Slightly smaller circular buttons, flat */
      .icon-circle{
        width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
        background:var(--circle);
        border:none;
        cursor:pointer;
        outline:none;
      }

      .icon-svg{width:14px;height:14px;fill:var(--icon)}

      .topbar-spacer{flex:1}

      /* Keep the content area fixed and not scrollable */
      main{position:fixed;left:0;right:0;top:var(--topbar-height);bottom:0;overflow:hidden}

      /* placeholder area for canvas */
      .canvas-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#bdbdbd}

      /* accessibility focus state (subtle) */
      .icon-circle:focus{outline:2px solid rgba(191,191,191,0.08)}

    </style>
  </head>
  <body>

    <!-- full-viewport frame; JS will calculate --frame-radius to better match device shape -->
    <div class="device-frame" aria-hidden="true"></div>

    <div class="topbar" role="banner">
      <div class="topbar-left">
        <div class="gallery-label">Gallery</div>

        <div class="icon-row" aria-hidden="false">
          <!-- Wrench / settings icon -->
          <button class="icon-circle" title="Wrench" aria-label="Wrench">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21.5 14.8l-3.6-3.6a6.1 6.1 0 0 0 .2-1.2 6.1 6.1 0 0 0-6.1-6.1c-.4 0-.8.05-1.2.15L6.4 1.6 4.6 3.4l3.9 3.9c-.1.4-.15.8-.15 1.2 0 3 2.5 5.5 5.5 5.5.4 0 .8-.05 1.2-.15l3.9 3.9 1.8-1.8-3.1-3.1z"/>
            </svg>
          </button>

          <!-- Magic wand icon -->
          <button class="icon-circle" title="Magic Wand" aria-label="Magic Wand">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.6 18.4L10.4 11 13 13.6 6.2 20.4 3.6 18.4zM19 7l1.2-1.2L21.4 7 20.2 8.2 19 7zm-4-1l.6-1.6.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/>
            </svg>
          </button>

          <!-- S-shaped ribbon icon -->
          <button class="icon-circle" title="Ribbon" aria-label="Ribbon">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6c2.2 0 3 1.7 5 1.7s2.8-1.7 5-1.7v2c-2.2 0-3 1.7-5 1.7s-2.8-1.7-5-1.7V6zM6 15c2.2 0 3-1.7 5-1.7s2.8 1.7 5 1.7v-2c-2.2 0-3-1.7-5-1.7s-2.8 1.7-5 1.7v2z"/>
            </svg>
          </button>

          <!-- Mouse cursor icon -->
          <button class="icon-circle" title="Cursor" aria-label="Cursor">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l6 12 3-2 6 8-15-18z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <div aria-hidden="true" style="opacity:0.6;font-size:13px;padding-right:18px">&nbsp;</div>
    </div>

    <main>
      <div class="canvas-placeholder">Canvas area (to be added)</div>
    </main>

    <script>
      // Calculate frame radius dynamically from viewport to better match device curvature on iPad-sized screens
      function updateFrameRadius() {
        const minDim = Math.min(window.innerWidth, window.innerHeight);
        // Use a percentage of the smaller dimension; tweak factor as needed
        const radius = Math.max(18, Math.round(minDim * 0.05));
        document.documentElement.style.setProperty('--frame-radius', radius + 'px');
      }
      window.addEventListener('resize', updateFrameRadius);
      updateFrameRadius();

      // Ensure topbar is not inset or floating — keep it flush
      // No-op: CSS positions topbar at the very top; script left intentionally minimal
    </script>
  </body>
</html>
