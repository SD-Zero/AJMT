<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Mastertrack Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-color: #1e1329;
      --card-bg: #2b1d38;
      --accent: #ffe66d;
      --highlight: #4ecdc4;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      text-align: center;
    }
    h1 { color: var(--accent); margin-top: 0; }
    .btn {
      background: var(--highlight);
      color: #121e1d;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      font-size: 0.95rem;
    }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    input[type="file"] { display: none; }

    /* Inspector Display Bar */
    .inspector-bar {
      background: #12091c;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      margin-top: 15px;
      font-family: monospace;
      color: var(--accent);
      min-height: 24px;
    }

    /* Piano Roll Horizontal Scroll Container */
    .visualizer-container {
      width: 100%;
      max-width: 900px;
      background: #160c21;
      border-radius: 12px;
      border: 1px solid #3c2a4d;
      overflow-x: auto;
      overflow-y: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .roll-canvas {
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="header-card">
  <h1>AJ Mastertrack Visualizer</h1>
  <button class="btn" onclick="document.getElementById('midiInput').click()">📁 Load MIDI</button>
  <button id="playBtn" class="btn" disabled>▶ Play</button>
  <button id="downloadBtn" class="btn" disabled>💾 Export MIDI</button>

  <input type="file" id="midiInput" accept=".mid,.midi">

  <div class="inspector-bar" id="inspector">
    Tap/Click any note block in the timeline to view details...
  </div>
</div>

<div class="visualizer-container" id="visualContainer">
  <canvas id="rollCanvas" class="roll-canvas"></canvas>
</div>

<script>
  let parsedMidi = null;
  let synth = null;
  let interactiveNotes = [];

  // Track Colors (Up to 11 AJ Layers)
  const TRACK_COLORS = [
    '#ff6b6b', '#4ecdc4', '#ffe66d', '#1a535c', '#f7fff7',
    '#ff9f1c', '#2ec4b6', '#e71d36', '#ff99c8', '#fcf6bd', '#d0f4de'
  ];

  // Game Limits
  const MAX_TIME_SECONDS = 300;
  const MAX_LAYERS = 11;
  const MIN_NOTE = 12;
  const MAX_NOTE = 96;

  document.getElementById('midiInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();
    parsedMidi = new Midi(arrayBuffer);

    cleanAndRender();
  });

  function cleanAndRender() {
    if (!parsedMidi) return;

    // Enforce 11 Layers Cap
    if (parsedMidi.tracks.length > MAX_LAYERS) {
      parsedMidi.tracks = parsedMidi.tracks.slice(0, MAX_LAYERS);
    }

    interactiveNotes = [];

    // Clean notes and build hitboxes
    parsedMidi.tracks.forEach((track, trackIndex) => {
      const instrumentName = track.instrument ? track.instrument.name : `AJ Layer ${trackIndex + 1}`;
      
      track.notes = track.notes.filter(n => n.time <= MAX_TIME_SECONDS).map(note => {
        // Clamp & Quantize
        if (note.midi < MIN_NOTE) note.midi = MIN_NOTE;
        if (note.midi > MAX_NOTE) note.midi = MAX_NOTE;
        note.time = Math.round(note.time * 4) / 4;
        note.duration = Math.max(0.125, Math.round(note.duration * 4) / 4);

        return note;
      });

      // Prepare notes for canvas rendering
      track.notes.forEach(note => {
        interactiveNotes.push({
          trackIndex: trackIndex,
          instrument: instrumentName,
          name: note.name,
          octave: note.octave,
          pitch: note.midi,
          time: note.time,
          duration: note.duration
        });
      });
    });

    drawPianoRoll();
    
    document.getElementById('playBtn').disabled = false;
    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('inspector').innerText = "MIDI loaded! Scroll horizontally to view sequence.";
  }

  function drawPianoRoll() {
    const canvas = document.getElementById('rollCanvas');
    const ctx = canvas.getContext('2d');

    // Scale sizing: 1 second = 50 pixels horizontally
    const pxPerSecond = 50;
    const maxDuration = Math.min(MAX_TIME_SECONDS, parsedMidi.duration || 60);
    
    canvas.width = Math.max(900, maxDuration * pxPerSecond);
    canvas.height = 300;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Lines (1-second intervals)
    ctx.strokeStyle = '#231633';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += pxPerSecond) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }

    // Render Note Blocks
    interactiveNotes.forEach(n => {
      const x = n.time * pxPerSecond;
      const y = canvas.height - ((n.pitch - MIN_NOTE) / (MAX_NOTE - MIN_NOTE) * canvas.height);
      const width = Math.max(6, n.duration * pxPerSecond);
      const height = 6;

      // Save hitbox for clicking
      n.hitbox = { x, y: y - height, w: width, h: height };

      ctx.fillStyle = TRACK_COLORS[n.trackIndex % TRACK_COLORS.length];
      ctx.fillRect(x, y - height, width, height);
    });
  }

  // Handle Note Click / Tap Inspector
  document.getElementById('rollCanvas').addEventListener('click', (e) => {
    const canvas = document.getElementById('rollCanvas');
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    const hit = interactiveNotes.find(n => {
      return clickX >= n.hitbox.x && clickX <= (n.hitbox.x + n.hitbox.w) &&
             clickY >= n.hitbox.y && clickY <= (n.hitbox.y + n.hitbox.h);
    });

    if (hit) {
      document.getElementById('inspector').innerText = 
        `Layer: ${hit.trackIndex + 1} (${hit.instrument}) | Note: ${hit.name} | Octave: ${hit.octave} | Duration: ${hit.duration.toFixed(2)}s | Start: ${hit.time.toFixed(2)}s`;
    }
  });

  // Audio Playback
  document.getElementById('playBtn').addEventListener('click', async () => {
    await Tone.start();
    if (!synth) synth = new Tone.PolySynth(Tone.Synth).toDestination();

    Tone.Transport.cancel();
    parsedMidi.tracks.forEach(track => {
      track.notes.forEach(note => {
        Tone.Transport.schedule((time) => {
          synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
        }, note.time);
      });
    });
    Tone.Transport.start();
  });

  // Download
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([parsedMidi.toArray()], { type: 'audio/midi' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'aj_mastertrack.mid';
    a.click();
  });
</script>

</body>
</html>
