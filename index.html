<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Jam Mastertrack Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #2b1d38;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #3c2a4d;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #ffe66d; margin-bottom: 8px; }
    p { color: #d0c2e0; font-size: 0.95rem; }
    .upload-box {
      border: 2px dashed #ffe66d;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      background: #322242;
      cursor: pointer;
    }
    input[type="file"] { display: none; }
    .btn {
      background: #4ecdc4;
      color: #1a2625;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
      font-size: 1rem;
    }
    .btn:disabled { background: #666; cursor: not-allowed; }
    .status-log {
      background: #1e1329;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      font-family: monospace;
      font-size: 0.85rem;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 15px;
      color: #a0f0d0;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>AJ Mastertrack Tool</h1>
  <p>Converts messy MIDI files to match Animal Jam limits.</p>

  <div class="upload-box" onclick="document.getElementById('midiInput').click()">
    <span id="uploadLabel">📁 Tap to upload messy MIDI</span>
    <input type="file" id="midiInput" accept=".mid,.midi">
  </div>

  <button id="playBtn" class="btn" disabled>▶ Preview Audio</button>
  <button id="downloadBtn" class="btn" disabled>💾 Export Clean MIDI</button>

  <div class="status-log" id="statusLog">Status: Waiting for file...</div>
</div>

<script>
  let parsedMidi = null;
  let synth = null;

  // Animal Jam Game Rules
  const MAX_TIME_SECONDS = 300; // 5 Minutes max
  const MAX_LAYERS = 11;        // Max 11 tracks
  const MIN_NOTE = 12;          // C0
  const MAX_NOTE = 96;          // C7

  function log(msg) {
    const logBox = document.getElementById('statusLog');
    logBox.innerHTML += `<br>[*] ${msg}`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  document.getElementById('midiInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('uploadLabel').innerText = file.name;
    log(`Loading file: ${file.name}`);

    const arrayBuffer = await file.arrayBuffer();
    parsedMidi = new Midi(arrayBuffer);

    cleanMidiForAnimalJam();
  });

  function cleanMidiForAnimalJam() {
    if (!parsedMidi) return;

    log("Applying Animal Jam rule set...");

    // Rule 1: Limit to 11 Sound Layers
    if (parsedMidi.tracks.length > MAX_LAYERS) {
      log(`Track limit exceeded! Truncated from ${parsedMidi.tracks.length} to 11 tracks.`);
      parsedMidi.tracks = parsedMidi.tracks.slice(0, MAX_LAYERS);
    }

    parsedMidi.tracks.forEach((track, index) => {
      // Rule 2 & 3: Filter 5-minute cap and clamp note pitch (C0 - C7)
      track.notes = track.notes.filter(note => {
        return note.time <= MAX_TIME_SECONDS; // Delete notes past 5 minutes
      }).map(note => {
        // Clamp octave pitch
        if (note.midi < MIN_NOTE) note.midi = MIN_NOTE;
        if (note.midi > MAX_NOTE) note.midi = MAX_NOTE;

        // Rule 4: Grid Quantization (16th note snap)
        note.time = Math.round(note.time * 4) / 4;
        note.duration = Math.max(0.1, Math.round(note.duration * 4) / 4);

        return note;
      });
    });

    log("✓ Cleanup complete! File ready.");
    document.getElementById('playBtn').disabled = false;
    document.getElementById('downloadBtn').disabled = false;
  }

  // Audio Preview Setup
  document.getElementById('playBtn').addEventListener('click', async () => {
    await Tone.start();
    
    if (!synth) {
      synth = new Tone.PolySynth(Tone.Synth).toDestination();
    }

    Tone.Transport.cancel();
    
    parsedMidi.tracks.forEach(track => {
      track.notes.forEach(note => {
        Tone.Transport.schedule((time) => {
          synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
        }, note.time);
      });
    });

    Tone.Transport.start();
    log("Playing preview...");
  });

  // Export File
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const midiArray = parsedMidi.toArray();
    const blob = new Blob([midiArray], { type: 'audio/midi' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'aj_ready_mastertrack.mid';
    a.click();
    log("Downloaded clean MIDI!");
  });
</script>

</body>
</html>
